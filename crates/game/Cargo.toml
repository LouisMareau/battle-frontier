[package]
name = "engine-game"
description = "The game: one program for the browser (WebAssembly) and the desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
engine-content = { path = "../content" }
engine-core = { path = "../core" }
engine-render = { path = "../render" }
engine-world = { path = "../world" }
eframe.workspace = true
egui.workspace = true
# the game's icons are SVG (crates/game/icons/), drawn at any size
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# controllers: the system's own way on the desktop (Windows.Gaming.Input on Windows, evdev
# on Linux: CI needs libudev-dev), the Gamepad API in the browser
gilrs = "0.11"
# the Requests window's pictures: PNG, JPG and WebP (on both: the browser's window is the
# desktop's)
image = { workspace = true, features = ["jpeg", "webp"] }
glam.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
# Publish: the files sent to GitHub, in base64
base64 = "0.22"
# the browser's saves as one zip (Saved in this browser): each file's checksum
crc32fast = "1"

# The browser: assets fetched over HTTP (a model request's run in the cloud followed as its
# events stream in), the page's clock, test hooks on <body data-*>, the editor's saves kept in
# the browser (IndexedDB)
[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = { version = "0.7", features = ["streaming"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "Blob", "BlobPropertyBag", "Document", "DomStringList", "DomStringMap", "Element", "Event", "EventTarget", "GainNode", "Gamepad", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "Location", "Navigator", "Performance", "Storage", "StorageManager", "Url", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Publish: GitHub's API over HTTPS (ureq and rustls underneath), the files' ids as git names them
ehttp = "0.7"
sha1_smol = "1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "vorbis"] }

# the local time of day (Windows has its own call)
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"
