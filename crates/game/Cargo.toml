[package]
name = "engine-game"
description = "The game: one program for the browser (WebAssembly) and the desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
engine-content = { path = "../content" }
engine-core = { path = "../core" }
engine-render = { path = "../render" }
engine-world = { path = "../world" }
eframe.workspace = true
egui.workspace = true
# the game's icons are SVG (crates/game/icons/), drawn at any size
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# controllers: the system's own way on the desktop (Windows.Gaming.Input on Windows, evdev
# on Linux: CI needs libudev-dev), the Gamepad API in the browser
gilrs = "0.11"
image.workspace = true
glam.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true

# The browser: assets fetched over HTTP, the page's clock, test hooks on <body data-*>
[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.7"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "Blob", "BlobPropertyBag", "Document", "DomStringMap", "Element", "GainNode", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Performance", "Storage", "Url", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "vorbis"] }
# the Requests window's pictures: PNG, JPG and WebP
image = { workspace = true, features = ["jpeg", "webp"] }

# the local time of day (Windows has its own call)
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"
