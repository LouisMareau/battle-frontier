[package]
name = "engine-world"
description = "Maps: the grid of cells and levels, what stands on them, procedural trees, collisions, and their geometry"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "world"

[dependencies]
engine-content = { path = "../content" }
glam.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
# props' real models (glTF, as Blender exports them), and writing them back out
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
image.workspace = true
