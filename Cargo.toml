[workspace]
resolver = "2"
members = ["crates/content", "crates/core", "crates/world", "crates/render", "crates/game"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"

[profile.release]
opt-level = 3
lto = "thin"

# the game stays playable in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
